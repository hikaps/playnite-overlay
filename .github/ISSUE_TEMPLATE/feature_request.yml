name: Feature Request
description: Suggest a new feature or enhancement for the Playnite Overlay plugin
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make the overlay better? Please describe it below. Check existing issues first to avoid duplicates!

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem does this feature solve? Is there a use case you're missing?
      placeholder: "I'd like to be able to filter running apps by game source..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe what you'd like the feature to do in detail.
      placeholder: "Add a filter dropdown in the RUNNING APPS section that lets me show only Steam games..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've tried?
      placeholder: "I currently just scroll through the full list manually..."

  - type: dropdown
    id: category
    attributes:
      label: Area
      description: Which area of the plugin does this relate to?
      options:
        - Overlay UI
        - Input (hotkey / controller)
        - App detection
        - Settings / configuration
        - Shortcuts
        - Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Screenshots, mockups, or any other context that helps explain the request.
